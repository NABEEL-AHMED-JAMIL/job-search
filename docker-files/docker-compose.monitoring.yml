version: "3.9"

# ════════════════════════════════════════════════════════════════════════════
# OBSERVABILITY & MONITORING STACK
# ════════════════════════════════════════════════════════════════════════════
# Use with: docker-compose -f docker-compose.monitoring.yml up -d
#
# Includes:
# - Prometheus (metrics collection & time-series DB)
# - Grafana (visualization dashboards)
# - Elasticsearch (log aggregation)
# - Kibana (log visualization)
# - Redis (caching & session store)
# ════════════════════════════════════════════════════════════════════════════

services:
  # ─────────────────────── METRICS & OBSERVABILITY ──────────────────────────

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    networks:
      - monitoring_net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USERNAME: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - monitoring_net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─────────────────────── LOG AGGREGATION ────────────────────────────────

  opensearch:
    image: opensearchproject/opensearch:2.10.0
    container_name: opensearch
    restart: unless-stopped
    ports:
      - "9200:9200"
    environment:
      discovery.type: single-node
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      # Disable security plugin for local development (not for production)
      plugins.security.disabled: "true"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    networks:
      - monitoring_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health?local=true"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.10.0
    container_name: opensearch-dashboards
    restart: unless-stopped
    ports:
      - "5601:5601"
    environment:
      OPENSEARCH_HOSTS: http://opensearch:9200
    depends_on:
      opensearch:
        condition: service_healthy
    networks:
      - monitoring_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5601/api/status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ─────────────────────── CACHING & SESSION STORE ──────────────────────────

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass redis123
    networks:
      - monitoring_net
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: redis-commander
    restart: unless-stopped
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    ports:
      - "8083:8081"
    environment:
      REDIS_HOSTS: local:redis:6379:0:redis123
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - monitoring_net

  # ─────────────────────── JOB MONITORING (APScheduler Dashboard) ───────────

  flower:
    image: mher/flower:latest
    container_name: flower
    restart: unless-stopped
    ports:
      - "5555:5555"
    environment:
      CELERY_BROKER_URL: redis://:redis123@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:redis123@redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - monitoring_net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5555"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  opensearch_data:
    driver: local
  redis_data:
    driver: local

networks:
  monitoring_net:
    driver: bridge

