version: "3.9"

# ════════════════════════════════════════════════════════════════════════════
# INTEGRATED STACK: OLLAMA + OPENSEARCH + REDIS
# ════════════════════════════════════════════════════════════════════════════
# Use with: docker-compose -f docker-compose.integrated.yml up -d
#
# Includes:
# - Ollama (LLM runtime & API server)
# - OpenSearch (log aggregation & search)
# - OpenSearch Dashboards (log visualization)
# - Redis (caching & session store)
# - Redis Commander (Redis UI)
# - Cassandra (NoSQL wide-column database)
# - Cassandra Web (Cassandra data viewer)
# - MinIO (S3-compatible local object/file storage, with web console)
# ════════════════════════════════════════════════════════════════════════════

services:
  # ─────────────────────── OLLAMA LLM RUNTIME ────────────────────────────

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    ports:
      - "11434:11434"
    volumes:
      # Persist downloaded models
      - ollama_models:/root/.ollama
    networks:
      - integrated_net
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # Increase shm_size for larger models
    shm_size: 4gb
    environment:
      # Optional: set Ollama environment variables
      OLLAMA_HOST: 0.0.0.0:11434

  # ───────────��─────────── OLLAMA MODEL INITIALIZATION ──────────────────────
  # This service pulls the mistral model when the stack starts
  ollama-setup:
    image: ollama/ollama:latest
    container_name: ollama-setup
    restart: "no"
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    networks:
      - integrated_net
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until ollama list >/dev/null 2>&1; do
          echo "Waiting for Ollama API to become ready..."
          sleep 2
        done
        ollama pull mistral
        echo "Model ready!"
    environment:
      OLLAMA_HOST: http://ollama:11434

  # ─────────────────────── OPENSEARCH (LOG AGGREGATION) ───────────────────

  opensearch:
    image: opensearchproject/opensearch:2.10.0
    container_name: opensearch
    restart: unless-stopped
    ports:
      - "9200:9200"
    environment:
      discovery.type: single-node
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      # Disable security plugin for local development (not for production)
      plugins.security.disabled: "true"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    networks:
      - integrated_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health?local=true"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.10.0
    container_name: opensearch-dashboards
    restart: unless-stopped
    ports:
      - "5601:5601"
    environment:
      OPENSEARCH_HOSTS: http://opensearch:9200
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    depends_on:
      opensearch:
        condition: service_healthy
    networks:
      - integrated_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5601/api/status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ─────────────────────── REDIS (CACHING & SESSION STORE) ────────────────

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass redis123
    networks:
      - integrated_net
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: redis-commander
    restart: unless-stopped
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    ports:
      - "8084:8081"
    environment:
      REDIS_HOSTS: local:redis:6379:0:redis123
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - integrated_net

  # ─────────────────────── CASSANDRA (NOSQL DATABASE) ─────────────────────

  cassandra:
    image: cassandra:4.1
    container_name: cassandra
    restart: unless-stopped
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: integrated_cluster
    volumes:
      - cassandra_data:/var/lib/cassandra
    networks:
      - integrated_net
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe cluster' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  cassandra-web:
    image: markusgulden/cassandra-web:latest
    container_name: cassandra-web
    restart: unless-stopped
    ports:
      - "8085:3000"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cassandra-web --hosts "$(getent hosts cassandra | awk '{print $1}')" --port 9042
    depends_on:
      cassandra:
        condition: service_healthy
    networks:
      - integrated_net

  # ─────────────────────── MINIO (LOCAL FILE/OBJECT STORAGE) ──────────────
  # S3-compatible storage. API on 9000, web console on 9001 for
  # uploading/browsing files/buckets by hand.

  minio:
    image: minio/minio:latest
    container_name: minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio_data:/data
    command: ["server", "/data", "--console-address", ":9001"]
    networks:
      - integrated_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  ollama_models:
    driver: local
  opensearch_data:
    driver: local
  redis_data:
    driver: local
  cassandra_data:
    driver: local
  minio_data:
    driver: local

networks:
  integrated_net:
    driver: bridge

