# NOTE: the addresses below are hardcoded rather than ${VAR:-default} interpolation on purpose --
# Docker Compose auto-loads the .env file that already sits in this same directory (written
# for the host-venv workflow, e.g. KAFKA_SERVERS=localhost:9093) to resolve ${VAR} references,
# and that host-facing value would silently win over any inline default here, since ":-default"
# only applies when the variable is completely unset. Inside a container "localhost" means the
# container itself, not the host, so these need host.docker.internal unconditionally.
#
# Credentials are the opposite case and are never written here. They are ${VAR:?} with no
# default, so the stack refuses to start rather than coming up on a value committed to the
# repository; .env.example lists the names that have to be set.
services:

  audio-extract-service:
    build: .
    image: job-search-app
    container_name: audio_extract_service
    restart: always
    ports:
      - "8100:8100"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ETL_EVENT_URL: http://host.docker.internal:9098/api/v1
      # Shared secret for /changeState and /addLogs. Must match process's value, or the
      # backend rejects these callbacks and job status silently stops updating.
      WORKER_CALLBACK_TOKEN: ${WORKER_CALLBACK_TOKEN:-}
      METER_URL: http://host.docker.internal:8200
      MINIO_ENDPOINT: host.docker.internal:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY in .env}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY in .env}
      MINIO_BUCKET_NAME: etl-bucket
      MINIO_SECURE: "false"
    command: ["uvicorn", "etl.service.audio_extract_service:app", "--host", "0.0.0.0", "--port", "8100", "--workers", "1"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # The metering service: the usage ledger every pipeline and the console report to. Its own
  # schema (meter) in the console's Postgres; reads need METER_SERVICE_KEY, a pipeline reports
  # with its run's callback token, which the meter verifies with the console.
  etl-meter:
    build: .
    image: job-search-app
    container_name: etl_meter
    restart: always
    ports:
      - "8200:8200"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ETL_EVENT_URL: http://host.docker.internal:9098/api/v1
      METER_DATABASE_URL: ${METER_DATABASE_URL:?set METER_DATABASE_URL in .env (postgresql://meter_app:<password>@host.docker.internal:5433/billing_db)}
      METER_SERVICE_KEY: ${METER_SERVICE_KEY:?set METER_SERVICE_KEY in .env}
      # The meter schema lives in billing_db under billing-service's Liquibase changelog (MIG-88, P6):
      # this service's role (meter_app) runs no DDL there. true only for a ledger in a database of its own.
      METER_APPLY_DDL: ${METER_APPLY_DDL:-false}
      METER_ROLLUP_SECONDS: "15"
    command: ["uvicorn", "etl.meter.app:create_app", "--factory", "--host", "0.0.0.0", "--port", "8200", "--workers", "1"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8200/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  tpd-scrapping-listener:
    build: .
    image: job-search-app
    container_name: tpd_scrapping_listener
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Kafka isn't reachable via host.docker.internal:9093 for a *containerized* client --
    # it advertises EXTERNAL://localhost:9093 (correct for the host-venv workflow only) and
    # INTERNAL://kafka:9092 (for containers on its own network). Kafka is actually part of
    # process's docker-compose stack, on the process_default network -- join that instead of
    # touching Kafka's own config (zero risk to the existing host-based consumers).
    networks:
      - default
      - process_default
    environment:
      ETL_EVENT_URL: http://host.docker.internal:9098/api/v1
      # Shared secret for /changeState and /addLogs. Must match process's value, or the
      # backend rejects these callbacks and job status silently stops updating.
      WORKER_CALLBACK_TOKEN: ${WORKER_CALLBACK_TOKEN:-}
      METER_URL: http://host.docker.internal:8200
      MINIO_ENDPOINT: host.docker.internal:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY in .env}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY in .env}
      MINIO_BUCKET_NAME: etl-bucket
      MINIO_SECURE: "false"
      KAFKA_SERVERS: kafka:9092
      KAFKA_SCRAPPING_TOPIC: scrapping-topic
      SCRAPPING_GROUP_ID: scrapping-group
      # Broker security. This stack's Kafka is PLAINTEXT; a deployment pointing the workers
      # at a SASL or TLS cluster sets these in .env, and the consumer refuses to start rather
      # than falling back to an anonymous connection when the credentials are missing. The
      # ssl_* paths must name files that exist inside the container, so they need a mount too.
      KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
      KAFKA_SASL_MECHANISM: ${KAFKA_SASL_MECHANISM:-}
      KAFKA_SASL_USERNAME: ${KAFKA_SASL_USERNAME:-}
      KAFKA_SASL_PASSWORD: ${KAFKA_SASL_PASSWORD:-}
      KAFKA_SSL_CAFILE: ${KAFKA_SSL_CAFILE:-}
      KAFKA_SSL_CERTFILE: ${KAFKA_SSL_CERTFILE:-}
      KAFKA_SSL_KEYFILE: ${KAFKA_SSL_KEYFILE:-}
      JOBSEARCH_USER_AGENT: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/91.0.4472.124 Safari/537.36"
      # v4_backend -- a separate local Postgres (Homebrew postgresql@18 on the host,
      # port 5432) that the F768920 pipeline imports Firebase users into. Reached via
      # host.docker.internal like the other host-side services above; the host's
      # pg_hba.conf trusts 127.0.0.1 and Docker Desktop's proxy makes this appear as
      # loopback traffic to Postgres, so no extra pg_hba changes were needed.
      V4_BACKEND_HOST: host.docker.internal
      V4_BACKEND_PORT: "5432"
      V4_BACKEND_DB: v4_backend
      V4_BACKEND_USER: nabeel.amd93
      V4_BACKEND_PASSWORD: ${V4_BACKEND_PASSWORD:?set V4_BACKEND_PASSWORD in .env}
    command: ["python", "-m", "etl.tpd.tpd_scrapping_listener"]

  # The test-loop consumer. Its pipeline is simulated work -- a counted loop with a short
  # sleep and one audit-log callback per iteration -- so it exercises dispatch, concurrency
  # and the callback path at a duration we choose, without depending on any external site.
  # Runs 3 processes x 10 threads, so one container is 30 parallel workers.
  tpd-test-listener:
    build: .
    image: job-search-app
    container_name: tpd_test_listener
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - process_default
    environment:
      ETL_EVENT_URL: http://host.docker.internal:9098/api/v1
      WORKER_CALLBACK_TOKEN: ${WORKER_CALLBACK_TOKEN:-}
      KAFKA_SERVERS: kafka:9092
      KAFKA_TEST_TOPIC: test-topic
      TEST_GROUP_ID: test-group
      # An AI step handed to this worker may read the object a field names (etl/util/ai_steps),
      # so the test listener reaches the object store the same way the pipeline listener does.
      MINIO_ENDPOINT: host.docker.internal:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY in .env}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY in .env}
      MINIO_BUCKET_NAME: etl-bucket
      MINIO_SECURE: "false"
      # Broker security. This stack's Kafka is PLAINTEXT; a deployment pointing the workers
      # at a SASL or TLS cluster sets these in .env, and the consumer refuses to start rather
      # than falling back to an anonymous connection when the credentials are missing. The
      # ssl_* paths must name files that exist inside the container, so they need a mount too.
      KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
      KAFKA_SASL_MECHANISM: ${KAFKA_SASL_MECHANISM:-}
      KAFKA_SASL_USERNAME: ${KAFKA_SASL_USERNAME:-}
      KAFKA_SASL_PASSWORD: ${KAFKA_SASL_PASSWORD:-}
      KAFKA_SSL_CAFILE: ${KAFKA_SSL_CAFILE:-}
      KAFKA_SSL_CERTFILE: ${KAFKA_SSL_CERTFILE:-}
      KAFKA_SSL_KEYFILE: ${KAFKA_SSL_KEYFILE:-}
    command: ["python", "-m", "etl.tpd.tpd_test_listener"]

networks:
  process_default:
    external: true
